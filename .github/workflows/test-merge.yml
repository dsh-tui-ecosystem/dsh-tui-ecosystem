name: test-merge
on: workflow_dispatch

permissions:
  contents: write
  pull-requests: write

jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            try {
              const r = await github.rest.pulls.merge({
                owner: 'dsh-tui-ecosystem', repo: 'dsh-tui-ecosystem',
                pull_number: 9, merge_method: 'squash',
              })
              console.log('MERGE OK', JSON.stringify(r.data))
            } catch (e) {
              console.log('MERGE FAIL:', e.message)
              core.setFailed(e.message)
            }
